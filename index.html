   const destroy=paper.destroy.bind(paper);paper.destroy=()=>{stopDemo();destroy();};LCK.activity=paper;update();
  }else LCK.activity=null;
  LCK.onColor=null;
  LCK.bindActions(async a=>{
   if(a==='next'||a==='prev'){index=(index+(a==='next'?1:-1)+chars.length)%chars.length;LCK.state[kind+'Index']=index;LCK.persist(kind+'Index',index);render();}
   if(['recognize','trace','independent','count'].includes(a)){mode=a;render();}
   if(a==='speak')LCK.audio.speak(kind==='abc'?`Huruf ${char}. ${char} untuk ${word}.`:`Ayo hitung apelnya. ${Array.from({length:index},(_,i)=>LCK.numberWords[i+1]).join(', ')}. ${description}`);
   if(a==='undo')paper?.undo();if(a==='redo')paper?.redoStroke();
   if(a==='clear'&&await LCK.confirm('Coba dari awal?','Garis latihan ini akan dihapus.')){stopDemo();paper.clear();}
   if(a==='check'){
    stopDemo();paper.finish();paper.draw();const result=LCK.geometry.validate(paper.strokes.map(s=>s.p),ref);
    if(result.ok){LCK.complete(kind+':'+char+':'+mode);LCK.notice('🌟 Hebat sekali! Garismu sudah mengikuti bentuknya.');LCK.$('paper').classList.add('celebrate');LCK.audio.reward();}
    else LCK.notice(result.completed?'Bagus! Coba lagi bagian yang belum lengkap.':'Ayo ikuti garisnya! Mulai dari titik hijau dan lengkapi setiap garis.');
   }
   if(a==='demo'){
    if(demonstrating)return;paper.finish();demonstrating=true;const refs=ref.map(s=>LCK.geometry.resample(s,70)),start=performance.now();
    const animate=now=>{if(!paper.canvas.isConnected){stopDemo();return;}const amount=(now-start)/12,strokeIndex=Math.floor(amount/90),count=Math.min(70,Math.floor(amount%90));paper.draw();const ctx=paper.canvas.getContext('2d'),q=paper.square;ctx.save();ctx.translate(q.x,q.y);ctx.scale(q.s,q.s);ctx.strokeStyle='#d89337';ctx.lineWidth=.02;ctx.lineCap='round';refs.forEach((s,i)=>{const n=i<strokeIndex?s.length:i===strokeIndex?count:0;if(!n)return;ctx.beginPath();s.slice(0,n).forEach((p,j)=>j?ctx.lineTo(...p):ctx.moveTo(...p));ctx.stroke();});ctx.restore();if(strokeIndex<refs.length)demoFrame=requestAnimationFrame(animate);else{stopDemo();paper.request();}};demoFrame=requestAnimationFrame(animate);
   }
   if(a.startsWith('answer-')){if(Number(a.slice(7))===index){LCK.complete('count:'+char);LCK.notice('🌟 Betul! Hebat sekali!');LCK.audio.reward();}else{LCK.notice('Ayo hitung pelan-pelan. Coba sekali lagi!');}}
  });
 };render();
};
</script>

  <script>

LCK.bindActions=fn=>document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>{const now=performance.now();if(b._last&&now-b._last<280)return;b._last=now;fn(b.dataset.action);});

LCK.complete=key=>{if(!LCK.state.progress[key]){LCK.state.progress[key]={completedAt:new Date().toISOString()};LCK.persist('progress',LCK.state.progress);}};

 abc:`<svg viewBox="0 0 160 130" aria-hidden="true"><rect x="10" y="27" width="72" height="76" rx="14" fill="#f8e9bb" stroke="#bda064" stroke-width="3" transform="rotate(-10 46 65)"/><rect x="78" y="37" width="71" height="76" rx="14" fill="#f5dccd" stroke="#bb927a" stroke-width="3" transform="rotate(9 113 75)"/><text x="23" y="85" fill="#9b7841" font-family="Arial" font-weight="bold" font-size="58">A</text><text x="89" y="95" fill="#b17158" font-family="Arial" font-weight="bold" font-size="54">B</text><path d="M109 10l3 10 11 2-9 7 2 11-10-6-10 5 3-11-8-8 12-1Z" fill="#7f9f89"/></svg>`,
 num:`<svg viewBox="0 0 160 130" aria-hidden="true"><rect x="23" y="10" width="115" height="111" rx="16" fill="#fff4dc" stroke="#839cb1" stroke-width="3"/><path d="M28 43h105m-105 32h105" stroke="#c4d3de" stroke-width="4"/><circle cx="53" cy="42" r="13" fill="#dd9a83"/><circle cx="93" cy="42" r="13" fill="#dd9a83"/><circle cx="61" cy="75" r="13" fill="#86ad91"/><circle cx="103" cy="75" r="13" fill="#86ad91"/><text x="39" y="112" font-family="Arial" font-size="24" font-weight="bold" fill="#647f94">1 2 3</text></svg>`
};
LCK.heroArt=`<svg viewBox="0 0 450 285" aria-hidden="true"><path d="M69 130C50 24 218 4 291 45s135 100 63 169S80 264 69 130" fill="#eef0df"/><path d="M85 78q100-105 209 0" fill="none" stroke="#dba394" stroke-width="14" stroke-linecap="round"/><path d="M101 79q85-84 175 0" fill="none" stroke="#e4c77e" stroke-width="13" stroke-linecap="round"/><path d="M118 79q68-62 140 0" fill="none" stroke="#9eb5a1" stroke-width="12" stroke-linecap="round"/><g transform="rotate(-8 180 170)"><rect x="95" y="102" width="174" height="136" rx="12" fill="#fffdf6" stroke="#d4d8c2" stroke-width="3"/><path d="M118 210q25-87 51-35t58-12" fill="none" stroke="#d9a17f" stroke-width="9" stroke-linecap="round"/><circle cx="222" cy="130" r="14" fill="#edce7b"/><path d="M136 154q14-27 29-3" fill="none" stroke="#97b49b" stroke-width="6"/></g><g transform="rotate(15 300 159)"><path d="M278 91q24-42 49 0v112q-24 20-49 0Z" fill="#e5bf70"/><path d="M278 91l24-46 25 46" fill="#e9c9a1"/><path d="M294 61l8-16 9 16" fill="#596653"/><path d="M290 100v93m24-93v93" stroke="#c59d53" stroke-width="4"/><path d="M278 203q24 20 49 0v17q-24 24-49 0Z" fill="#d99c93"/></g><g fill="#658974"><path d="M353 58l5 15 16 5-16 5-5 16-5-16-16-5 16-5Z"/><path d="M55 196l4 11 12 4-12 4-4 12-4-12-12-4 12-4Z"/></g><path d="M355 213q20-47 34-14-2 29-34 38-32-9-34-38 14-33 34 14" fill="#dfa595"/><circle cx="77" cy="122" r="5" fill="#d5b970"/><circle cx="391" cy="126" r="5" fill="#d5b970"/></svg>`;
LCK.renderHome=()=>{
 const cards=[['paint','Melukis','Bebaskan imajinasi dengan warna dan kuas.','SENI & KREATIVITAS','pink'],['color','Mewarnai','Beri warna pada dunia kecil yang ceria.','WARNA & BENTUK','yellow'],['abc','Belajar Huruf','Kenali huruf, ikuti garis, mulai menulis.','HURUF A–Z','mint'],['num','Belajar Angka','Hitung, kenali, dan tulis angka bersama.','ANGKA 0–9','blue']];
 LCK.$('main').innerHTML=`<section class="hero"><div><div class="eyebrow">Tempat bermain & bertumbuh</div><h1>Ide kecil,<br><em>petualangan besar.</em></h1><p>Halo, seniman cilik! Ada dunia penuh warna untuk dijelajahi. Mau bermain apa hari ini?</p><span class="badge">✦ Untuk si kecil usia 4–6 tahun</span></div><div class="hero-art">${LCK.heroArt}</div></section><div class="section-head"><h2>Pilih petualanganmu <span style="color:#c3a15a">✧</span></h2><p>Belajar seru, selangkah demi selangkah.</p></div><section class="games" aria-label="Pilihan aktivitas">${cards.map(([key,title,desc,tag,cls])=>`<button class="game-card" data-game="${key}"><div class="card-art ${cls}">${LCK.illustrations[key]}</div><div class="card-copy"><h3>${title}</h3><p>${desc}</p><div class="card-bottom">${tag}<span class="arrow">↗</span></div></div></button>`).join('')}</section><aside class="reassure"><span>♧</span><p><strong>Setiap coretan adalah langkah kecil yang berarti.</strong><br>Tanpa terburu-buru. Tanpa nilai. Cukup rasa ingin tahu dan senang mencoba.</p></aside>`;
 document.querySelectorAll('[data-game]').forEach(b=>b.onclick=()=>LCK.navigate(b.dataset.game));
};
LCK.navigate=mode=>{
 LCK.activity?.destroy();LCK.activity=null;LCK.onColor=null;LCK.mode=mode;LCK.$('home-button').hidden=mode==='home';
 ({home:LCK.renderHome,paint:LCK.renderDrawing,color:LCK.renderColoring,abc:LCK.renderAlphabet,num:LCK.renderNumbers,parent:LCK.renderParent})[mode]();
 LCK.$('main').focus({preventScroll:true});window.scrollTo(0,0);
};
LCK.parentGate=async()=>{
 const a=12+Math.floor(Math.random()*8),b=8+Math.floor(Math.random()*9);
 const answer=await LCK.confirm('Khusus orang tua',`Untuk masuk, berapa ${a} + ${b}? Gerbang ini mencegah anak masuk tanpa sengaja, bukan autentikasi keamanan.`,true);
 if(answer!==false&&Number(answer)===a+b)LCK.navigate('parent');else if(answer!==false)LCK.notice('Jawaban belum tepat. Silakan coba lagi.');
};
LCK.renderParent=()=>{
 const b=LCK.button,keys=Object.keys(LCK.state.progress);
 LCK.$('main').innerHTML=LCK.heading('Ruang orang tua','Temani langkah kecil mereka.','♡')+`<section class="parent-panel"><h2>Perjalanan belajar</h2><div class="stats"><div class="stat"><strong>${keys.filter(k=>k.startsWith('abc:')).length}</strong><span>Latihan huruf selesai</span></div><div class="stat"><strong>${keys.filter(k=>k.startsWith('num:')).length}</strong><span>Latihan menulis angka</span></div><div class="stat"><strong>${keys.filter(k=>k.startsWith('count:')).length}</strong><span>Latihan menghitung</span></div><div class="stat"><strong>${LCK.state.gallery.length}</strong><span>Karya di galeri</span></div></div><p>Melukis · 13 gambar mewarnai · huruf kapital A–Z · angka 0–9. Pengenalan, contoh gerakan, menebalkan garis, menulis mandiri, dan menghitung.</p><details><summary>Latihan yang telah diselesaikan</summary><ul class="status-list" id="progress-list"></ul></details><p>Catatan ini menunjukkan latihan yang lolos pemeriksaan bentuk sederhana, bukan penilaian perkembangan atau diagnosis. Huruf kecil belum tersedia.</p></section><section class="parent-panel"><h2>Preferensi & penyimpanan</h2>${b(LCK.audio.muted?'♫ Nyalakan suara':'♫ Matikan suara','mute')}${b('☁ '+(LCK.state.cloud?'Matikan':'Aktifkan')+' salinan Drive','cloud')}${b('Hapus data perangkat','delete','danger')}<p>Karya dan kemajuan tersimpan di browser ini, tidak permanen dan tidak otomatis tersinkron antarperangkat. Unduh PNG untuk cadangan. Drive hanya menerima salinan karya baru setelah diaktifkan, menggunakan akun Google yang memberi izin. Tidak ada data pribadi anak yang diminta.</p><p id="cloud-status"></p></section><section class="parent-panel"><h2>Galeri karya kecil</h2><div id="gallery" class="gallery"></div></section>`;
 const list=LCK.$('progress-list');keys.forEach(key=>{const [kind,char,mode]=key.split(':');const li=document.createElement('li');li.textContent=`${kind==='abc'?'Huruf':kind==='count'?'Menghitung':'Angka'} ${char} · ${mode==='independent'?'mandiri':mode==='trace'?'ikuti garis':'jumlah'} · ${new Date(LCK.state.progress[key].completedAt).toLocaleDateString('id-ID')}`;list.append(li);});
 const urls=[];LCK.activity={destroy:()=>urls.forEach(URL.revokeObjectURL)};
 const target=LCK.$('gallery');if(!LCK.state.gallery.length)target.textContent='Belum ada karya tersimpan. Yuk, mulai melukis!';
 LCK.state.gallery.slice().reverse().forEach(async item=>{try{const art=await LCK.store.get('artwork:'+item.id);if(!art||!target.isConnected)return;const url=URL.createObjectURL(art.blob);urls.push(url);const article=document.createElement('article'),img=new Image(),label=document.createElement('small'),download=document.createElement('button');img.src=url;img.alt='Karya '+item.name;label.textContent=item.name+' · '+new Date(item.date).toLocaleDateString('id-ID');download.textContent='↓ Unduh PNG';download.onclick=()=>LCK.download(art.blob,item.name);article.append(img,label,download);target.append(article);}catch(e){if(target.isConnected)LCK.notice('Galeri belum dapat dibuka.');}});
 if(!window.google?.script?.run)LCK.$('cloud-status').textContent='Salinan Drive tersedia pada deployment Google Apps Script. Versi web statis tetap dapat menyimpan secara lokal.';
 LCK.bindActions(async a=>{
  if(a==='mute'){LCK.toggleAudio();LCK.renderParentRefresh();}
  if(a==='delete'&&await LCK.confirm('Hapus semua data perangkat?','Semua karya lokal, latihan tersimpan, dan kemajuan akan dihapus. PNG yang sudah diunduh dan salinan Drive tetap ada.')){
    try{await LCK.store.clear();LCK.state={drawing:[],coloring:{},traces:{},progress:{},gallery:[],completedColors:[],cloud:LCK.state.cloud};LCK.navigate('parent');LCK.notice('Data perangkat sudah dihapus.');}catch(e){LCK.notice('Data belum dapat dihapus. Coba lagi.');}
  }
  if(a==='cloud'){
   if(!window.google?.script?.run){LCK.notice('Buka versi Google Apps Script untuk menggunakan Drive.');return;}
   const enable=!LCK.state.cloud;
   if(enable&&!await LCK.confirm('Aktifkan salinan Drive?','Karya baru yang disimpan akan disalin ke folder aplikasi pada akun Google yang memberi izin. Karya lama tetap lokal.'))return;
   google.script.run.withSuccessHandler(()=>{LCK.state.cloud=enable;LCK.navigate('parent');LCK.notice(enable?'Salinan Drive diaktifkan.':'Salinan Drive dimatikan.');}).withFailureHandler(()=>LCK.notice('Drive belum dapat diubah. Pastikan akun telah memberi izin.')).setCloudStorageEnabled(enable);
  }
 });
};
LCK.renderParentRefresh=()=>{LCK.activity?.destroy();LCK.renderParent();};
LCK.toggleAudio=()=>{LCK.audio.muted=!LCK.audio.muted;LCK.audio.sync();if(LCK.audio.muted&&window.speechSynthesis)speechSynthesis.cancel();LCK.persist('muted',LCK.audio.muted);};
LCK.$('audio-button').onclick=LCK.toggleAudio;
LCK.$('home-button').onclick=()=>LCK.navigate('home');document.querySelector('.brand').onclick=e=>{e.preventDefault();LCK.navigate('home');};
LCK.$('parent-button').onclick=LCK.parentGate;
document.addEventListener('visibilitychange',()=>{if(document.hidden){LCK.activity?.finish?.();if(window.speechSynthesis)speechSynthesis.cancel();}else LCK.activity?.resize?.();});
LCK.ready=(async()=>{
 LCK.$('main').innerHTML='<p class="hint">Menyiapkan ruang bermain…</p>';
 try{for(const key of ['drawing','coloring','traces','progress','gallery','completedColors','colorIndex','abcIndex','numIndex']){const value=await LCK.store.get(key);if(value!==undefined)LCK.state[key]=value;}LCK.audio.muted=!!await LCK.store.get('muted');}catch(e){LCK.notice('Penyimpanan lokal tidak tersedia. Unduh karya sebelum menutup browser.');}
 LCK.audio.sync();LCK.navigate('home');
 if(window.google?.script?.run)google.script.run.withSuccessHandler(result=>{LCK.state.cloud=result.enabled===true;}).withFailureHandler(()=>{LCK.state.cloud=false;}).getCloudStorageStatus();
})();
</script>
