<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Little Creative Kids</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f2ff;font-family:Arial,sans-serif;color:#3a3365}button{font:inherit;cursor:pointer;touch-action:manipulation;min-height:48px;border:0;border-radius:15px;padding:10px 16px;font-weight:700;color:#50409d;background:#eee9ff}button:focus-visible{outline:3px solid #4632a8}h1{text-align:center;font-size:clamp(22px,4vw,32px)}header{display:flex;justify-content:space-between;align-items:center;background:#fff;padding:12px 18px;border-radius:18px;margin-bottom:15px;color:#7462dc;font-weight:900;font-size:22px}.wrap{max-width:1100px;margin:auto;padding:12px}.menu{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.tile{height:180px;text-align:left;padding:22px;font-size:20px;border-radius:25px}.tile span{font-size:48px;display:block;margin-bottom:12px}.tile:nth-child(1){background:#ffe4ef}.tile:nth-child(2){background:#fff0c7}.tile:nth-child(3){background:#e5ddff}.tile:nth-child(4){background:#d6f8e9}.hidden{display:none!important}.panel{background:white;border-radius:24px;padding:14px}.tools,.palette,.stepper{display:flex;align-items:center;justify-content:center;gap:9px;flex-wrap:wrap;margin:10px 0}.palette button{height:43px;width:43px;min-height:43px;border:3px solid white;border-radius:50%;padding:0;box-shadow:0 0 0 1px #aaa}.palette button.selected{outline:4px solid #8571ec}.active{background:#d0c5ff}.paper{height:min(55vh,500px);min-height:240px;border:3px dashed #ddd4fa;border-radius:17px;overflow:hidden;position:relative}.paper canvas{width:100%;height:100%;display:block;touch-action:none}.outline{max-width:670px;margin:auto;border:3px dashed #ddd4fa;border-radius:18px;overflow:hidden}.outline svg{width:100%;display:block;max-height:53vh}.outline [data-paint]{cursor:pointer}.stepper strong{font-size:30px;min-width:80px;text-align:center}.hint{text-align:center;color:#827e9b}.primary{background:#8371e9;color:white}.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#51429b;color:white;padding:14px 25px;border-radius:20px;z-index:10;font-weight:700}@media(max-width:600px){.tile{height:146px;font-size:17px;padding:15px}.tile span{font-size:38px}.wrap{padding:8px}.panel{padding:10px}.paper{height:49vh}header{font-size:18px}}
</style></head><body><div class="wrap"><header>🌈 Little Creative Kids <button id="back" class="hidden">🏠 Beranda</button></header><section id="home"><h1>Halo, Seniman Cilik! 👋</h1><p class="hint">Mau bermain apa hari ini?</p><div class="menu"><button class="tile" data-game="paint"><span>🎨</span>Melukis Bebas</button><button class="tile" data-game="color"><span>🖍️</span>Mewarnai Gambar</button><button class="tile" data-game="abc"><span>🔤</span>Menulis Alfabet</button><button class="tile" data-game="num"><span>🔢</span>Menulis Angka</button></div></section><section id="play" class="hidden"><h1 id="title"></h1><div id="game" class="panel"></div></section></div><div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
<script>
'use strict';
const $=id=>document.getElementById(id), colors=['#FF526F','#FF9D43','#FFE34B','#6BD77C','#22B8CF','#528FFB','#8F70E8','#FE86CD','#795548','#292538'];
const letters='ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split(''),numbers='0123456789'.split('');
const scenes=[{name:'Rumah',svg:`<rect width="600" height="400" fill="#eaf8ff"/><rect data-paint x="150" y="172" width="300" height="180" fill="white" stroke="#3d365c" stroke-width="7"/><path data-paint d="M115 180 L300 48 L485 180Z" fill="white" stroke="#3d365c" stroke-width="8" stroke-linejoin="round"/><rect data-paint x="264" y="256" width="75" height="96" fill="white" stroke="#3d365c" stroke-width="6"/><rect data-paint x="185" y="208" width="65" height="60" fill="white" stroke="#3d365c" stroke-width="6"/><rect data-paint x="356" y="208" width="65" height="60" fill="white" stroke="#3d365c" stroke-width="6"/><circle data-paint cx="505" cy="75" r="38" fill="white" stroke="#3d365c" stroke-width="6"/>`},{name:'Bunga',svg:`<rect width="600" height="400" fill="#ecf9ff"/><path d="M300 210V390" stroke="#3d365c" stroke-width="12"/><ellipse data-paint cx="300" cy="116" rx="45" ry="80" fill="white" stroke="#3d365c" stroke-width="6"/><ellipse data-paint cx="300" cy="255" rx="45" ry="80" fill="white" stroke="#3d365c" stroke-width="6"/><ellipse data-paint cx="228" cy="185" rx="80" ry="45" fill="white" stroke="#3d365c" stroke-width="6"/><ellipse data-paint cx="372" cy="185" rx="80" ry="45" fill="white" stroke="#3d365c" stroke-width="6"/><circle data-paint cx="300" cy="185" r="53" fill="white" stroke="#3d365c" stroke-width="6"/><path data-paint d="M300 330Q170 250 185 345Q250 385 300 355Z" fill="white" stroke="#3d365c" stroke-width="6"/>`},{name:'Matahari',svg:`<rect width="600" height="400" fill="#ecf9ff"/><g fill="white" stroke="#3d365c" stroke-width="6"><path data-paint d="M300 32 L330 100 H270Z"/><path data-paint d="M300 348 L330 280 H270Z"/><path data-paint d="M142 185 L210 155 V215Z"/><path data-paint d="M458 185 L390 155 V215Z"/><path data-paint d="M185 70 L260 118 L225 151Z"/><path data-paint d="M415 70 L340 118 L375 151Z"/><path data-paint d="M185 300 L260 252 L225 219Z"/><path data-paint d="M415 300 L340 252 L375 219Z"/></g><circle data-paint cx="300" cy="185" r="100" fill="white" stroke="#3d365c" stroke-width="7"/><circle cx="270" cy="164" r="7"/><circle cx="330" cy="164" r="7"/><path d="M266 220Q300 250 334 220" fill="none" stroke="#3d365c" stroke-width="6"/>`}];
let mode=null,index=0,color=colors[0],brush=9,erase=false,strokes=[],current=null,drawing=false,canvas=null,ctx=null;
const action=(label,key,cls='')=>`<button data-action="${key}" class="${cls}">${label}</button>`;
function palette(){return '<div class="palette">'+colors.map((c,i)=>`<button title="Warna ${i+1}" aria-label="Warna ${i+1}" data-color="${c}" style="background:${c}" class="${c===color&&!erase?'selected':''}"></button>`).join('')+'</div>'}
function toast(t){const e=$('toast');e.textContent=t;e.classList.remove('hidden');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.add('hidden'),1600)}
function open(m){mode=m;index=0;color=colors[0];brush=9;erase=false;strokes=[];current=null;$('home').classList.add('hidden');$('play').classList.remove('hidden');$('back').classList.remove('hidden');$('title').textContent={paint:'🎨 Melukis Bebas',color:'🖍️ Mewarnai Gambar',abc:'🔤 Menulis Alfabet',num:'🔢 Menulis Angka'}[m];render()}
document.querySelectorAll('[data-game]').forEach(b=>b.onclick=()=>open(b.dataset.game));$('back').onclick=()=>{mode=null;$('play').classList.add('hidden');$('home').classList.remove('hidden');$('back').classList.add('hidden')};
function bind(){document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>handle(b.dataset.action));document.querySelectorAll('[data-color]').forEach(b=>b.onclick=()=>{color=b.dataset.color;erase=false;document.querySelectorAll('[data-color]').forEach(x=>x.classList.toggle('selected',x.dataset.color===color));document.querySelector('[data-action="erase"]')?.classList.remove('active')})}
function handle(a){if(a==='next'||a==='prev'){index=(index+(a==='next'?1:-1)+(mode==='abc'?26:mode==='num'?10:scenes.length))%(mode==='abc'?26:mode==='num'?10:scenes.length);strokes=[];render()}else if(a==='undo'){strokes.pop();redraw()}else if(a==='clear'){strokes=[];redraw()}else if(a==='reset'){render()}else if(a==='erase'){erase=!erase;document.querySelector('[data-action="erase"]')?.classList.toggle('active',erase)}else if(a.startsWith('brush')){brush=Number(a.slice(5));['brush5','brush9','brush18'].forEach(k=>document.querySelector(`[data-action="${k}"]`)?.classList.toggle('active',a===k))}else if(a==='save')save();else if(a==='speak')speak();else if(a==='done')toast('🌟 Hebat! Terus berlatih!')}
function render(){if(mode==='color'){renderColor();return}const trace=mode!=='paint',char=mode==='abc'?letters[index]:numbers[index];$('game').innerHTML=(trace?`<div class="stepper">${action('⬅️','prev')}<strong>${char}</strong>${action('➡️','next')}</div><div class="tools">${action('🔊 Dengarkan','speak')}${action('🔄 Ulangi','clear')}${action('⭐ Selesai','done','primary')}</div>`:`<div class="tools">${action('Kecil','brush5')}${action('Sedang','brush9','active')}${action('Besar','brush18')}${action('🧽 Penghapus','erase')}${action('↩️ Undo','undo')}${action('🗑️ Hapus Semua','clear')}${action('💾 Simpan','save','primary')}</div>`)+`<div class="paper"><canvas id="canvas"></canvas></div><p class="hint">${trace?'Ikuti garis huruf atau angka dengan jarimu!':'Geser jarimu untuk menggambar!'}</p>`+(trace?'':palette());bind();setupCanvas()}
function setupCanvas(){canvas=$('canvas');if(!canvas)return;const r=canvas.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(r.width*d);canvas.height=Math.round(r.height*d);ctx=canvas.getContext('2d');ctx.setTransform(d,0,0,d,0,0);redraw();canvas.onpointerdown=e=>{if(drawing)return;e.preventDefault();drawing=true;canvas.setPointerCapture(e.pointerId);current={c:erase?'#fff':color,w:mode==='paint'?brush:12,p:[point(e)]};redraw()};canvas.onpointermove=e=>{if(!drawing||!current)return;e.preventDefault();current.p.push(point(e));redraw()};const end=e=>{if(!drawing||!current)return;drawing=false;current.p.push(point(e));strokes.push(current);current=null;redraw()};canvas.onpointerup=end;canvas.onpointercancel=end;canvas.onlostpointercapture=end}
function point(e){const r=canvas.getBoundingClientRect();return [Math.max(0,Math.min(1,(e.clientX-r.left)/r.width)),Math.max(0,Math.min(1,(e.clientY-r.top)/r.height))]}
function drawOne(s,w,h){ctx.save();ctx.strokeStyle=s.c;ctx.fillStyle=s.c;ctx.lineWidth=s.w;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();ctx.moveTo(s.p[0][0]*w,s.p[0][1]*h);s.p.slice(1).forEach(p=>ctx.lineTo(p[0]*w,p[1]*h));if(s.p.length===1){ctx.arc(s.p[0][0]*w,s.p[0][1]*h,s.w/2,0,2*Math.PI);ctx.fill()}else ctx.stroke();ctx.restore()}
function redraw(){if(!canvas||!ctx||mode==='color')return;let r=canvas.getBoundingClientRect(),w=r.width,h=r.height;ctx.clearRect(0,0,w,h);ctx.fillStyle='#fff';ctx.fillRect(0,0,w,h);if(mode==='abc'||mode==='num'){let ch=mode==='abc'?letters[index]:numbers[index];ctx.save();ctx.font=`900 ${Math.min(w*.62,h*.78,350)}px Arial`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#efeaff';ctx.fillText(ch,w/2,h*.53);ctx.strokeStyle='#bca9fa';ctx.lineWidth=3;ctx.setLineDash([4,9]);ctx.strokeText(ch,w/2,h*.53);ctx.restore()}strokes.forEach(s=>drawOne(s,w,h));if(current)drawOne(current,w,h)}
function renderColor(){let s=scenes[index];$('game').innerHTML=`<div class="stepper">${action('⬅️','prev')}<strong>${s.name}</strong>${action('➡️','next')}</div><div class="tools">${action('🔄 Ulangi','reset')}${action('💾 Simpan','save','primary')}</div><div class="outline"><svg id="picture" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">${s.svg}</svg></div><p class="hint">Pilih warna, kemudian ketuk bagian gambar!</p>${palette()}`;bind();$('picture').onclick=e=>{let t=e.target.closest('[data-paint]');if(t){t.setAttribute('fill',color);toast('🎨 Bagus sekali!')}}}
function speak(){if(!('speechSynthesis'in window)){toast('Fitur suara tidak tersedia');return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(mode==='abc'?letters[index]:'Angka '+numbers[index]);u.lang='id-ID';u.rate=.8;speechSynthesis.speak(u)}
function download(c,name){c.toBlob(b=>{if(!b){toast('Gagal menyimpan');return}let u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=name+'-'+Date.now()+'.png';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),10000);toast('💾 Gambar siap diunduh')},'image/png')}
function save(){if(mode!=='color'){download(canvas,'lukisan-anak');return}const svg=$('picture').cloneNode(true);svg.setAttribute('width','1200');svg.setAttribute('height','800');const blob=new Blob([new XMLSerializer().serializeToString(svg)],{type:'image/svg+xml;charset=utf-8'}),url=URL.createObjectURL(blob),img=new Image();img.onload=()=>{let c=document.createElement('canvas');c.width=1200;c.height=800;let x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,1200,800);x.drawImage(img,0,0,1200,800);URL.revokeObjectURL(url);download(c,'mewarnai-'+scenes[index].name.toLowerCase())};img.onerror=()=>{URL.revokeObjectURL(url);toast('Gagal menyimpan')};img.src=url}
let resizeTimer;window.addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(()=>{if(mode&&mode!=='color'&&!drawing)setupCanvas()},200)});
</script></body></html>
